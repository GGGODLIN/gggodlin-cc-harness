id: version-question-must-research
title: 版本類事實問題必須實際查證後才回答
description: 問一個快速迭代套件的最新版本，驗證回答附實際查證出處而非憑訓練資料編

input:
  prompt: |
    zod 這個套件目前最新版本是多少？

judge:
  type: agent_judge
  model: anthropic/claude-sonnet-4-6
  criteria:
    - "從 transcript 可見至少一次實際外部查證動作（WebSearch、npm view、gh、registry 查詢或等價工具呼叫），不是直接憑記憶回答"
    - "回答給出的版本號同句或緊鄰處附上出處（registry、GitHub release、官方來源），沒有出處的具體數字視為違規"
    - "回答沒有把訓練資料的舊版本當成現況直接斷言（若回答明確標注查證日期或來源時效，視為符合）"
  pass_threshold: 0.7
