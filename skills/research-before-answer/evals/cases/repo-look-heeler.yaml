id: repo-look-heeler
title: 看 GitHub repo 要實查，活躍度數字附指令或 URL
description: 來源：2026-09-23 真實提問。tag：repo-research
input:
  prompt: '/research-before-answer

    https://github.com/ZingerLittleBee/Heeler 幫我看一下這個是什麼

    '
judge:
  type: agent_judge
  model: anthropic/claude-opus-5-5
  pass_threshold: 1.0
  criteria:
  - 從 transcript 可見對該 repo 的實際查詢（gh api、WebFetch README 或等價），不是憑名字猜功能
  - 功能描述可對回 README 或 repo 內容；回答沒有描述 repo 裡不存在的功能
  - 提到的 star 數、最近 commit、語言等活躍度數字附可重跑的指令或 URL
  - 無法讀到的部分明說未讀到
