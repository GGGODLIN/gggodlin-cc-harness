# 來源＝真實提問；基準線在 Sonnet 5.5 medium 下 37/40。另兩題 free-tier-groq-qwen、pricing-page-tavily
# 的檔案留在 cases/ 但不列入：回答必含 "rate limit" 字串，skill-up 會誤判成 provider 限流而整題 ERROR。
