schema_version: v1alpha1

environment:
  type: none

engine:
  name: claude_code
  model:
    provider: anthropic
    name: claude-sonnet-4-6

cases:
  files:
    - evals/cases/six-section-report.yaml
    - evals/cases/archived-repo-status.yaml
  defaults:
    timeout_seconds: 900
    max_turns: 40
  parallelism: 1

benchmark:
  enabled: false

report:
  formats: [json, html]
