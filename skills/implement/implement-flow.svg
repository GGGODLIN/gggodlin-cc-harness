        <title id="implement-flow-title">implement 票券執行與收尾雙閘門流程</title>
        <desc id="implement-flow-desc">由左至右展示 implement 的三個階段：前置盤點與 TDD 決策清單、Frontier 執行與 TDD 守門閘、跨軸審查修補與架構視覺核對。</desc>
