      --color-accent:  #bf4520;
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #agent-dispatch-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #agent-dispatch-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #agent-dispatch-flow-root .diagram-container { overflow-x: visible; }</style>
