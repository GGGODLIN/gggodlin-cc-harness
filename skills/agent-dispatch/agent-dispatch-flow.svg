        <title id="agent-dispatch-flow-title">agent-dispatch 跨外殼終端 Worker 派工流程</title>
        <desc id="agent-dispatch-flow-desc">由左至右展示 agent-dispatch 的三個階段：當次同意與隔離工位準備、啟動閘門與三種終端外殼分流、背景監看與收工對話對帳。</desc>
