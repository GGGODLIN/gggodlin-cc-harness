      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #model-onboard-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #model-onboard-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #model-onboard-flow-root .diagram-container { overflow-x: visible; }</style>
