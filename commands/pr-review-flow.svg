<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pr-review-flow-title pr-review-flow-desc" id="pr-review-flow-root">
        <title id="pr-review-flow-title">/pr-review 多軸對抗式審查與雙閘門流程</title>
        <desc id="pr-review-flow-desc">由左至右展示 /pr-review 的三個階段：前置隔離與標準挑選、選席授權閘門與平行審查席位、交叉驗證與報告投影寫入閘門。</desc>
        <defs>
      <style>#pr-review-flow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #pr-review-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #pr-review-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #pr-review-flow-root .diagram-container { overflow-x: visible; }</style>
          <marker id="pr-review-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
