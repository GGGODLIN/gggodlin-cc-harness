        <text x="170" y="72" fill="#5a6580" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 1 · PREFLIGHT &amp; WORKTREE</text>

