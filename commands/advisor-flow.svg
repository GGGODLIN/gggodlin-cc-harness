<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="advisor-flow-title advisor-flow-desc" id="advisor-flow-root">
        <title id="advisor-flow-title">/advisor 跨模型單次顧問外包與差異裁決流程</title>
        <desc id="advisor-flow-desc">由左至右展示 /advisor 的三個階段：問題抽離與額度推薦、顧問席位選擇與 Fable 守門閘、原文差異對照與使用者逐條裁決。</desc>
        <defs>
      <style>#advisor-flow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #advisor-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #advisor-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #advisor-flow-root .diagram-container { overflow-x: visible; }</style>
